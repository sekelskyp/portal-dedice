type AuthInfo {
  token: String!
  user: User!
}

type Mutation {
  signIn(email: String!, password: String!): AuthInfo!
  signUp(
    firstName: String!
    lastName: String!
    name: String!
    email: String!
    password: String!
  ): AuthInfo!
}

type Query {
  _empty: String!
  user(id: String!): User
  users: [User!]!
}

type User {
  id: ID!
  firstName: String
  lastName: String
  name: String!
  email: String!
}
